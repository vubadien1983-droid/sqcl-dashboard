name: Automated OneDrive Cloud Sync

on:
  schedule:
    # 07:00 AM ICT (Vietnam Time) -> 00:00 UTC
    - cron: '0 0 * * *'
    # 07:30 AM ICT (Cut-off Time)  -> 00:30 UTC
    - cron: '30 0 * * *'
    # 01:30 PM ICT (13:30 VN Time) -> 06:30 UTC
    - cron: '30 6 * * *'
    # 04:30 PM ICT (16:30 VN Time) -> 09:30 UTC
    - cron: '30 9 * * *'
    # 06:00 PM ICT (18:00 VN Time) -> 11:00 UTC
    - cron: '0 11 * * *'
  workflow_dispatch:
    # Allows manual trigger anytime from GitHub Actions tab or via API

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install openpyxl requests

      - name: Execute Automated Sync
        run: |
          python sync_cli.py

      - name: Commit and Push Changes if Updated
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add sqcl_data.json sqcl_data_bundle.js sqcl_closing_ledger.json sqcl_closing_ledger_bundle.js onedrive_file.xlsx static/app.min.js
          git diff --staged --quiet || (git commit -m "chore(auto-sync): update SQCL data from OneDrive [skip ci]" && git push)
